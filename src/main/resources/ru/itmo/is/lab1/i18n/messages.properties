# Стандартные сообщения Jakarta Faces на русском языке.
# {0} — введённое значение (у REQUIRED — подпись поля), {1} — пример, {2} — подпись поля.
jakarta.faces.component.UIInput.REQUIRED={0}: поле обязательно для заполнения
jakarta.faces.component.UIInput.REQUIRED_detail={0}: поле обязательно для заполнения
jakarta.faces.component.UIInput.CONVERSION=Некорректное значение
jakarta.faces.component.UIInput.CONVERSION_detail=Некорректное значение
jakarta.faces.component.UISelectOne.INVALID={0}: выбранное значение недоступно, обновите список
jakarta.faces.component.UISelectOne.INVALID_detail={0}: выбранное значение недоступно, обновите список
jakarta.faces.converter.IntegerConverter.INTEGER={2}: «{0}» — не целое число
jakarta.faces.converter.IntegerConverter.INTEGER_detail={2}: введите целое число от -2147483648 до 2147483647
jakarta.faces.converter.LongConverter.LONG={2}: «{0}» — не целое число
jakarta.faces.converter.LongConverter.LONG_detail={2}: введите целое число от -9223372036854775808 до 9223372036854775807
jakarta.faces.converter.DoubleConverter.DOUBLE={2}: «{0}» — не число
jakarta.faces.converter.DoubleConverter.DOUBLE_detail={2}: введите число, например {1}
jakarta.faces.converter.EnumConverter.ENUM={2}: недопустимое значение «{0}»
jakarta.faces.converter.EnumConverter.ENUM_detail={2}: недопустимое значение «{0}»
jakarta.faces.validator.BeanValidator.MESSAGE={0}
